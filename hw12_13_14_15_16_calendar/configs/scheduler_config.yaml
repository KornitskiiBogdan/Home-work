logger:
  level: "info"

storage:
  type: "sql"
  db:
    host: "postgres"
    port: 5432
    user: "postgres"
    password: "password"
    dbname: "backend"
    sslmode: "disable"

rabbitmq:
  host: "rabbitmq"
  port: 5672
  user: "rabbit"
  password: "password"
  queue: "notifications"
  ackQueue: "notifications.ack"

scheduler:
  interval: 1m
